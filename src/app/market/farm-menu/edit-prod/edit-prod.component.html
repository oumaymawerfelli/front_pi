<h2>Edit Product</h2>

<form (ngSubmit)="updateProduct()" class="edit-form">
  <div class="form-group">
    <label>Product Name:</label>
    <input type="text" [(ngModel)]="productToEdit.productName" name="productName" required>
  </div>

  <div class="form-group">
    <label>Description:</label>
    <textarea [(ngModel)]="productToEdit.productDescription" name="productDescription" rows="2"></textarea>
  </div>

  <div class="form-group">
    <label>Category:</label>
    <input type="text" [(ngModel)]="productToEdit.productCategory" name="productCategory">
  </div>

  <div class="form-group">
    <label>Price:</label>
    <input type="number" [(ngModel)]="productToEdit.productPrice" name="productPrice" min="0">
  </div>

  <div class="form-group">
    <label>Stock:</label>
    <input type="number" [(ngModel)]="productToEdit.productStock" name="productStock" min="0">
  </div>

  <div class="button-group">
    <button type="submit">Save Changes</button>
    <button type="button" (click)="cancelEdit()">Cancel</button>
  </div>
</form>
