<app-filter [all]="totalProductCount" 
 [inStock]="totalProductsInStock"
 [outOfStock]="totalProductsOutOfStock"
 (selectedFilterRadioButtonChanged)="onFilterChanged($event)">
</app-filter>
<div class="product-list">



  <ng-container *ngFor="let prod of products">
    <app-product 
  [product]="prod" 
  *ngIf="
    selectedFilterRadioButton === 'all' || 
    (selectedFilterRadioButton === 'true' && prod.productStock > 0) || 
    (selectedFilterRadioButton === 'false' && prod.productStock === 0)
">
</app-product>

  </ng-container>
</div>
