<div class="container mt-4">
    <h2>🛒 Contenu du Panier</h2>
    <table class="table table-bordered table-striped mt-3" *ngIf="lignesPanier.length > 0">
      <thead class="table-dark">
        <tr>
          <th>Produit</th>
          <th>Prix Unitaire</th>
          <th>Quantité</th>
          <th>Total</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let ligne of lignesPanier">
          <td>{{ ligne.produit.productName }}</td>
          <td>{{ ligne.produit.productPrice }} TND</td>
          <td>{{ ligne.quantite }}</td>
          <td>{{ ligne.prixTotal }} TND</td>
        </tr>
      </tbody>
    </table>
  
    <div *ngIf="lignesPanier.length === 0" class="alert alert-info">
      Le panier est vide.
    </div>
  </div>
