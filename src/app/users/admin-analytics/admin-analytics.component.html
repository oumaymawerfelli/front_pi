<div class="analytics-container">
    <h2>Login Attempts Analytics</h2>

    <div style="display: block;">
        <canvas 
          baseChart
          [data]="chartData"
          [options]="options"
          [type]="chartType"
          [legend]="true">
        </canvas>
    </div>

    <div class="summary-cards">
      <div class="card">
        <h3>Total Attempts</h3>
        <p>{{ loginAttempts.length }}</p>
      </div>
      <div class="card">
        <h3>Suspicious Logins</h3>
        <p>{{ suspiciousCount }}</p>
      </div>
    </div>
</div>
