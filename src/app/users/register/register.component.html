<p>Register works!</p>
<h2>Register</h2>
<form #registerForm="ngForm" (ngSubmit)="register()">
  <label for="name">Name:</label>
  <input id="name" type="text" [(ngModel)]="name" name="name" autocomplete="off" required /><br />

  <label for="email">Email:</label>
  <input id="email" type="email" [(ngModel)]="email" name="email" autocomplete="off" required /><br />

  <label for="password">Password:</label>
  <input id="password" type="password" [(ngModel)]="password" name="password" autocomplete="off" required /><br />

  <label for="role">Role:</label>
  <select id="role" [(ngModel)]="role" name="role" required>
    <option value="FARMER">Farmer</option>
    <option value="ADMIN">Admin</option>
  </select><br />

  <button type="submit" [disabled]="registerForm.invalid">Register</button>
</form>
