<div class="form-container">
  <h2>Login</h2>
  <form (submit)="login()">
    <label for="email">Email:</label>
    <input id="email" type="email" [(ngModel)]="email" name="email" required />

    <label for="password">Password:</label>
    <input id="password" type="password" [(ngModel)]="password" name="password" required />

    <button type="submit">Login</button>

    <p *ngIf="errorMessage" style="color:red">{{ errorMessage }}</p>
    <p><a routerLink="['/landing', 'register']">Don't have an account? Sign up</a></p>
    <p><a [routerLink]="['/landing', 'forgot-password']">Forgot password?</a>

    </p>

 
    <div class="social-icons">
      <button (click)="loginWithGoogle()" class="social-btn google-btn" title="Login with Google">
        <i class="fab fa-google"></i>
      </button>
    
      <button (click)="loginWithFacebook()" class="social-btn facebook-btn" title="Login with Facebook">
        <i class="fab fa-facebook-f"></i>
      </button>
    
      <button (click)="loginWithGitHub()" class="social-btn github-btn" title="Login with GitHub">
        <i class="fab fa-github"></i>
      </button>
      <button (click)="loginWithLinkedIn()" class="social-btn linked-in-btn" title="Login with LinkedIn">
        <i class="fab fa-linkedin"></i>

      </button>
    </div>
    <div style="margin-top: 15px;">
      <re-captcha 
        (resolved)="onCaptchaResolved($event)" 
        siteKey="6Ld-mh8rAAAAAKEsGwYAhz_2p-AQpA1-N_XseZyV">
      </re-captcha>
    </div>




  </form>
</div>

<style>
 

.social-btn:hover {
  background-color: #ddd;
}

.google-btn {
  background-color: #db4437;
  color: white;
}

.google-btn:hover {
  background-color: #c23321;
}

.facebook-btn {
  background-color: #3b5998;
  color: white;
}

.facebook-btn:hover {
  background-color: #2d4373;
}

.social-btn:hover {
  transform: scale(1.1);
}


.github-btn {
  background-color: #24292e;
  color: white;
}

.github-btn:hover {
  background-color: #1b1f23;
}

.social-btn i {
  font-size: 18px;
}

  /* Style for the form container */
.form-container {
  width: 100%;
  max-width: 400px;
  margin: 20px auto;
  padding: 20px;
  background-color: #f9f9f9;
  border-radius: 8px;
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
}

/* Style for the form heading */
.form-container h2 {
  text-align: center;
  margin-bottom: 20px;
  color: #333;
}

/* Style for the form labels */
.form-container label {
  display: block;
  margin-bottom: 5px;
  font-weight: bold;
  color: #555;
}

/* Style for the input fields */
.form-container input,
.form-container select {
  width: 100%;
  padding: 10px;
  margin-bottom: 15px;
  border: 1px solid #ccc;
  border-radius: 4px;
  box-sizing: border-box;
  font-size: 16px;
}

/* Style for the submit button */
.form-container button {
  width: 100%;
  padding: 10px;
  background-color: #4CAF50;
  color: white;
  border: none;
  border-radius: 4px;
  font-size: 16px;
  cursor: pointer;
}

.form-container button:hover {
  background-color: #45a049;
}

.form-container button:disabled {
  background-color: #ccc;
  cursor: not-allowed;
}

/* Style for the links (sign up/sign in) */
.form-container p {
  text-align: center;
}

.form-container a {
  color: #4CAF50;
  text-decoration: none;
}

.form-container a:hover {
  text-decoration: underline;
}

/* Style for error message */
.form-container p[style] {
  text-align: center;
  color: red;
  font-size: 14px;
}
/* Layout social icons horizontally */
.social-icons {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin-top: 15px;
}

/* Resize the buttons to small circles with just icons */
.social-btn {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  padding: 0;
  font-size: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
}


</style>
