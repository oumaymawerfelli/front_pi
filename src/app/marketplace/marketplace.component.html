<div class="product-list">
  <div *ngFor="let produit of produits" class="product-item">
    <div class="product-details">
      <h3>{{ produit.productName }}</h3>
    
      <p><strong>Prix:</strong> {{ produit.productPrice }} TND</p>
      <button class="btn btn-primary" (click)="addToCart(produit)">
        Ajouter au panier
      </button>
      
    </div>
  </div>
  <button class="btn btn-primary" (click)="goToPanier()">
    🛒 Consulter Panier
  </button>
  
</div>
