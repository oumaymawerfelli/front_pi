<div class="container">
    <h1>Liste des commandes</h1>
  
    
    <div *ngIf="isLoading" class="loading">Chargement...</div>
  
   
    <div *ngIf="errorMessage" class="error">{{ errorMessage }}</div>
  
  
    <div *ngIf="!isLoading && orders.length > 0">
      <table class="table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Client</th>
            <th>Status</th>
            <th>Date</th>
            <th>Total</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let order of orders">
            <td>{{ order.id }}</td>
            <td>{{ order.customer.name }}</td>
            <td>{{ order.status }}</td>
            <td>{{ order.dateCommande | date: 'short' }}</td>
            <td>{{ getTotalPrice(order) | currency: 'TND' }}</td>
            <td>
              <!--
              <button (click)="editOrder(order)" class="btn btn-warning">Éditer</button>-->
              <button (click)="deleteOrder(order.id ?? 0)" class="btn btn-danger">Supprimer</button>
            </td>
          </tr>
        </tbody>
      </table>
      <button class="btn btn-primary" (click)="retournerAuPanier()">
        Retour au Panier
      </button>
      
    </div>
