<!-- Button to Open Modal -->
<button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addEquipmentModal">
  Add Equipment
</button>

<!-- Add Equipment Modal -->
<div class="modal fade" id="addEquipmentModal" tabindex="-1" aria-labelledby="addEquipmentModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title" id="addEquipmentModalLabel">Add New Equipment</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>

      <form [formGroup]="equipmentForm" (ngSubmit)="submitEquipment()">
        <div class="modal-body">
          
          <div class="mb-3">
            <label for="name" class="form-label"><strong>Name:</strong></label>
            <input id="name" formControlName="nameEquipment" class="form-control" />
            <div *ngIf="equipmentForm.get('nameEquipment')?.invalid && equipmentForm.get('nameEquipment')?.touched" class="text-danger small">
              Required field
            </div>
          </div>

          <div class="mb-3">
            <label for="description" class="form-label"><strong>Description:</strong></label>
            <textarea id="description" formControlName="descriptionEquipment" rows="3" class="form-control"></textarea>
            <div *ngIf="equipmentForm.get('descriptionEquipment')?.invalid && equipmentForm.get('descriptionEquipment')?.touched" class="text-danger small">
              Required field
            </div>
          </div>

          <div class="form-check mb-3">
            <input type="checkbox" id="availability" formControlName="availabilityEquipment" class="form-check-input" />
            <label for="availability" class="form-check-label">Available</label>
          </div>

          <div class="mb-3">
            <label for="images" class="form-label"><strong>Image URLs (comma-separated):</strong></label>
            <input id="images" formControlName="images" class="form-control" />
          </div>

        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-dark" data-bs-dismiss="modal">Close</button>
          <button type="submit" class="btn btn-primary" [disabled]="equipmentForm.invalid">Add Equipment</button>
        </div>
      </form>

    </div>
  </div>
</div>
