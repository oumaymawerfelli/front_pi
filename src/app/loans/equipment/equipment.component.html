<main class="main">
  <!-- Page Title Section -->
  <div
    class="page-title dark-background"
    data-aos="fade"
    style="background-image: url(assets/img/page-title-bg.webp);"
  >
    <div class="container position-relative">
      <h1>{{ pageTitle }}</h1>
      <nav class="breadcrumbs">
        <ol>
          <li><a routerLink="/loan-info">Loan Info /</a></li>
          <li><a routerLink="/loan-management">Loan Management</a></li>
        </ol>
      </nav>
    </div>
  </div>

  <!-- Search Bar -->
  <div class="equipment-search">
    <input
      type="number"
      [(ngModel)]="searchId"
      placeholder="Enter Equipment ID"
    />
    <button (click)="getEquipment(searchId)">Search</button>
    <button (click)="resetSearch()">Reset</button>

    <div *ngIf="searchError" class="error">
      ⚠️ Equipment not found.
    </div>
  </div>

  <!-- Equipment List -->
  <h2>All Equipment</h2>
  <ul>
    <li *ngFor="let equipment of equipmentList">
      <h4>{{ equipment.nameEquipment }}</h4>
      <img
        *ngIf="equipment.images && equipment.images.length"
        [src]="equipment.images[0]"
        alt="{{ equipment.nameEquipment }}"
        width="100"
        height="100"
      />
      <button (click)="getEquipment(equipment.idEquipment)">View</button>
      <button (click)="deleteEquipment(equipment.idEquipment)">Delete</button>
    </li>
  </ul>

  <!-- Equipment Update Form -->
  <div *ngIf="selectedEquipment">
    <h3>Equipment Details</h3>
    <p><strong>Name:</strong> {{ selectedEquipment.nameEquipment }}</p>
    <p><strong>Type:</strong> {{ selectedEquipment.typeEquipment }}</p>
    <p><strong>Description:</strong> {{ selectedEquipment.descriptionEquipment }}</p>

    <form
      (ngSubmit)="updateEquipment(selectedEquipment.idEquipment, selectedEquipment)"
    >
      <label for="name">Name:</label>
      <input
        [(ngModel)]="selectedEquipment.nameEquipment"
        name="name"
     
      />

      <label for="type">Type:</label>
      <input [(ngModel)]="selectedEquipment.typeEquipment" name="type" />

      <label for="description">Description:</label>
      <input
        [(ngModel)]="selectedEquipment.descriptionEquipment"
        name="description"
      />

      <label for="imageUrls">Image URLs (comma-separated):</label>
      <input type="text" [(ngModel)]="imageUrlsInput" name="imageUrls" />

      <label for="images">Upload Images:</label>
      <input type="file" (change)="onFileSelected($event)" multiple />

      <button type="submit">Update</button>
    </form>
  </div>
</main>
