<div class="container">
  <h2>Pending User Approvals</h2>
  
  <div *ngIf="isLoading" class="loading">
    <p>Loading pending users...</p>
  </div>
  
  <div *ngIf="errorMessage" class="error">
    {{ errorMessage }}
  </div>

  <table class="user-table" *ngIf="pendingUsers.length > 0; else noPendingUsers">
    <thead>
      <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Phone</th>
        <th>Status</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let user of pendingUsers">
        <td>{{ user.name }}</td>
        <td>{{ user.email }}</td>
        <td>{{ user.phone }}</td>
        <td>{{ user.status }}</td>
        <td>
          <button class="approve-button" (click)="approve(user.idUser)">
            <i class="fas fa-check"></i> Approve
          </button>
        </td>
      </tr>
    </tbody>
  </table>

  <ng-template #noPendingUsers>
    <p *ngIf="!isLoading && !errorMessage">No pending users found.</p>
  </ng-template>

  <button class="back-button" routerLink="/list-users">
    <i class="fas fa-arrow-left"  ></i> Back to All Users
  </button>
</div>
