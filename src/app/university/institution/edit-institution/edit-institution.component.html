<div class="container mt-4">
  <h2>Edit Institution</h2>
  <form [formGroup]="institutionForm" (ngSubmit)="onUpdate()">
    <input type="hidden" formControlName="institutionId" />

    <div class="mb-3">
      <label for="name" class="form-label">Name</label>
      <input
        type="text"
        id="name"
        formControlName="name"
        class="form-control"
        required
      />
    </div>

    <div class="mb-3">
      <label for="location" class="form-label">Location</label>
      <input
        type="text"
        id="location"
        formControlName="location"
        class="form-control"
        required
      />
    </div>

    <button
      type="submit"
      class="btn btn-success"
      [disabled]="institutionForm.invalid"
    >
      Update
    </button>
    <button
      type="button"
      class="btn btn-secondary ms-2"
      (click)="onCancel()"
    >
      Cancel
    </button>
  </form>
</div>
