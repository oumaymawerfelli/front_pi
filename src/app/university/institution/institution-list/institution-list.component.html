
   





   



















































    <section id="services" class="services section-bg py-5">
      <div class="container" data-aos="fade-up">
        <div class="section-title text-center mb-5">
          <h2>INSTITUTIONS</h2>
          <p class="text-muted">Shaping Education for a Brighter Tomorrow</p>
        </div>
    
        <button (click)="toggleAddForm()" class="btn btn-success px-4">
          <i class="bx bx-plus"></i> Add Institution
        </button>
    
        <!-- Show Add form or Edit form -->
        <app-add-institution
         *ngIf="showAddForm"
          (institutionAdded)="onInstitutionAdded($event)"
          (cancelAdd)="onCancelAdd()">
        </app-add-institution>

        <!-- Show Edit Form -->
<app-edit-institution
*ngIf="selectedInstitutionToEdit"
[institution]="selectedInstitutionToEdit"
(institutionUpdated)="onInstitutionUpdated($event)"
(cancelEdit)="cancelEditForm()">
</app-edit-institution>

<app-modal-confirm-delete
  [isVisible]="isModalVisible"
  (confirm)="onConfirmDelete()"
  (cancel)="onCancelDelete()"
></app-modal-confirm-delete>

    
        <div class="row gy-4">
          <div class="col-lg-4 col-md-6" *ngFor="let inst of institutions">
            <div class="card h-100 shadow-sm border-0" data-aos="zoom-in" data-aos-delay="100">
              <div class="card-body d-flex flex-column">
                <div class="d-flex align-items-center mb-3">
                  <div class="icon rounded-circle bg-success text-white d-flex justify-content-center align-items-center me-3" style="width: 50px; height: 50px;">
                    <i class="bx bxs-university fs-4"></i>
                  </div>
                  <h5 class="mb-0">{{ inst.name }}</h5>
                </div>
    
                <p class="mb-4"><strong>Location:</strong> {{ inst.location }}</p>
    
                <div class="mt-auto d-flex justify-content-end">
                  <button (click)="onEdit(inst)" class="btn btn-primary btn-sm me-2">
                    Edit
                  </button>
                  <button (click)="openDeleteModal(inst.institutionId)">Delete</button>
                  

                </div>
                
              </div>
            </div>
          </div>
        </div>
    
      </div>
    </section>
