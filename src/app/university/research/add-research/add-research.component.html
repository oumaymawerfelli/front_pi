<div *ngIf="isFormVisible">

<form (ngSubmit)="onSubmit()" #researchForm="ngForm">
  <h2>Add New Research Project</h2>

  <div class="form-container">
    <!-- Left Column -->
    <div class="form-column">
      <!-- Title Field -->
      <div class="form-group">
        <label for="title">Title</label>
        <input
          type="text"
          id="title"
          class="form-control"
          [(ngModel)]="newProject.title"
          name="title"
          maxlength="100"
          required
        />
        <div *ngIf="!researchForm.form.controls['title']?.valid && researchForm.form.controls['title']?.touched" class="text-danger">
          Title is required.
        </div>
      </div>

      <!-- Description Field -->
      <div class="form-group">
        <label for="description">Description</label>
        <textarea
          id="description"
          class="form-control"
          [(ngModel)]="newProject.description"
          name="description"
          maxlength="500"
          required
        ></textarea>
        <div *ngIf="!researchForm.form.controls['description']?.valid && researchForm.form.controls['description']?.touched" class="text-danger">
          Description is required.
        </div>
      </div>

      <!-- Research Focus Field -->
      <div class="form-group">
        <label for="researchFocus">Research Focus</label>
        <select
          id="researchFocus"
          class="form-control"
          [(ngModel)]="newProject.researchFocus"
          name="researchFocus"
          required
        >
          <option value="Soil Fertility Management">Soil Fertility Management</option>
          <option value="Crop Rotation and Diversification">Crop Rotation and Diversification</option>
          <option value="Water Conservation Techniques">Water Conservation Techniques</option>
          <option value="Organic Farming Practices">Organic Farming Practices</option>
          <option value="Agroforestry">Agroforestry</option>
          <option value="Precision Agriculture">Precision Agriculture</option>
          <option value="Integrated Pest Management">Integrated Pest Management</option>
          <option value="Soil Erosion Control">Soil Erosion Control</option>
          <option value="Hydroponics or Aquaponics">Hydroponics or Aquaponics</option>
          <option value="Sustainable Livestock Grazing">Sustainable Livestock Grazing</option>
          <option value="Agrochemical Use and Environmental Impact">Agrochemical Use and Environmental Impact</option>
          <option value="Biochar for Soil Improvement">Biochar for Soil Improvement</option>
          <option value="Plant Disease Management">Plant Disease Management</option>
          <option value="Composting and Waste Recycling">Composting and Waste Recycling</option>
          <option value="Renewable Energy Integration">Renewable Energy Integration</option>
          <option value="Agri-ecosystem Restoration">Agri-ecosystem Restoration</option>
          <option value="Improved Irrigation Systems">Improved Irrigation Systems</option>
          <option value="Bee Pollination and Crop Productivity">Bee Pollination and Crop Productivity</option>
          <option value="Forest Farming">Forest Farming</option>
          <option value="Medicinal Plant Cultivation">Medicinal Plant Cultivation</option>
        </select>
        <div *ngIf="!researchForm.form.controls['researchFocus']?.valid && researchForm.form.controls['researchFocus']?.touched" class="text-danger">
          Research focus is required.
        </div>
      </div>
      <div class="form-group">
        <label for="status">Status</label>
        <select
          id="status"
          class="form-control"
          [(ngModel)]="newProject.status"
          name="status"
          required
        >
          <option value="Active">Active</option>
          <option value="Completed">Completed</option>
          <option value="Pending">Pending</option>
          <option value="On Hold">On Hold</option>
        </select>
        <div *ngIf="!researchForm.form.controls['status']?.valid && researchForm.form.controls['status']?.touched" class="text-danger">
          Status is required.
        </div>
      </div>
    </div>

    <!-- Right Column -->
    <div class="form-column">
      <!-- Status Field -->
      

      <!-- Climate Conditions Field -->
      <div class="form-group">
        <label for="climateConditions">Climate Conditions</label>
        <select
          id="climateConditions"
          class="form-control"
          [(ngModel)]="newProject.climateConditions"
          name="climateConditions"
        >
          <option value="Tropical">Tropical</option>
          <option value="Temperate">Temperate</option>
          <option value="Arid">Arid</option>
          <option value="Cold">Cold</option>
        </select>
      </div>

      <!-- Requested Funding Field -->
      <div class="form-group">
        <label for="fundingSource">Requested Funding</label>
        <input
          type="text"
          id="fundingSource"
          class="form-control"
          [(ngModel)]="newProject.fundingSource"
          name="fundingSource"
          required
          pattern="^[0-9]+(\.[0-9]{1,2})?$"
          placeholder="Enter amount (e.g., 1000, 5000.75)"
        />
        <div *ngIf="!researchForm.form.controls['fundingSource']?.valid && researchForm.form.controls['fundingSource']?.touched" class="text-danger">
          Please enter a valid amount (e.g., 1000, 5000.75).
        </div>
      </div>

      <!-- Start Date Field -->
      <div class="form-group">
        <label for="startDate">Start Date</label>
        <input
          type="date"
          id="startDate"
          class="form-control"
          [(ngModel)]="newProject.startDate"
          name="startDate"
          [min]="minDate"
          required
        />
        <div *ngIf="!researchForm.form.controls['startDate']?.valid && researchForm.form.controls['startDate']?.touched" class="text-danger">
          Start date is required.
        </div>
      </div>

      <!-- Estimated Duration Field -->
      <div class="form-group">
        <label for="estimatedDuration">Estimated Duration (in months)</label>
        <input
          type="number"
          id="estimatedDuration"
          class="form-control"
          [(ngModel)]="newProject.estimatedDuration"
          name="estimatedDuration"
          min="1"
          required
        />
        <div *ngIf="!researchForm.form.controls['estimatedDuration']?.valid && researchForm.form.controls['estimatedDuration']?.touched" class="text-danger">
          Estimated duration is required and must be at least 1 month.
        </div>
      </div>

      <!-- Submit Button -->
      <div class="form-group">
        <button type="submit" class="btn btn-primary" [disabled]="!researchForm.form.valid">
          Add Project
        </button>
      </div>
    </div>
  </div>
</form>
</div>
<!-- Redirect Message after Submission -->
<div *ngIf="formSubmitted" class="alert alert-success alert-dismissible fade show">
  <p class="success-message">Project added successfully! Redirecting...</p>
  <button type="button" class="btn-close" aria-label="Close" (click)="closeSuccessMessage()"></button>
</div>
